version: 2.1

orbs:
  docker: circleci/docker@2.8.1
  helm: circleci/helm@3.1.0
  kubernetes: circleci/kubernetes@1.3.1
  node: circleci/node@7.0.0

aliases:
  - node_version: &node_version '22.14'
  - &restore_repo_cache
    key: repo-{{ .Environment.CIRCLE_SHA1 }}
  - &save_repo_cache
    <<: *restore_repo_cache
    paths:
      - ./
  - &restore_version_cache
    key: version-{{ .Environment.CIRCLE_SHA1 }}
  - &save_version_cache
    <<: *restore_version_cache
    paths:
      - ./VERSION
  - &restore_node_modules_cache
    key: node_modules-{{ checksum "yarn.lock" }}
  - &save_node_modules_cache
    <<: *restore_node_modules_cache
    paths:
      - ./node_modules
  - &restore_build_cache
    key: assets-{{ .Environment.CIRCLE_SHA1 }}
  - &save_build_cache
    <<: *restore_build_cache
    paths:
      - ./dist

jobs:
  checkout:
    executor:
      name: node/default
      tag: *node_version
    steps:
      - checkout
      - save_cache: *save_repo_cache

  version:
    docker:
    executor:
      name: node/default
      tag: *node_version
    steps:
      - restore_cache: *restore_repo_cache
      - run: export PACKAGE_VERSION=$(cat VERSION)
      - run: echo $PACKAGE_VERSION
      - run: cat package.json
      - run: yarn version --no-git-tag-version --allow-same-version $PACKAGE_VERSION
      - run: cat package.json
      - save_cache: *save_version_cache

  install:
    executor:
      name: node/default
      tag: *node_version
    steps:
      - restore_cache: *restore_repo_cache
      - restore_cache: *restore_version_cache
      - run: node --version
      - run: yarn --version
      - run: yarn install
      - save_cache: *save_node_modules_cache

  test-e2e:
    executor:
      name: node/default
      tag: *node_version
    steps:
      - restore_cache: *restore_repo_cache
      - restore_cache: *restore_version_cache
      - restore_cache: *restore_node_modules_cache
      - run: yarn test:e2e:coverage --maxWorkers=2
      - store_artifacts:
          path: coverage-e2e/
      - store_artifacts:
          path: reports/junit/e2e/
      - store_test_results:
          path: coverage-e2e/
      - store_test_results:
          path: reports/junit/e2e/

  test-unit:
    executor:
      name: node/default
      tag: *node_version
    steps:
      - restore_cache: *restore_repo_cache
      - restore_cache: *restore_version_cache
      - restore_cache: *restore_node_modules_cache
      - run: yarn test:coverage --maxWorkers=2
      - store_artifacts:
          path: coverage/
      - store_artifacts:
          path: reports/junit/unit/
      - store_test_results:
          path: coverage/
      - store_test_results:
          path: reports/junit/unit/

  test-lint:
    executor:
      name: node/default
      tag: *node_version
    steps:
      - restore_cache: *restore_repo_cache
      - restore_cache: *restore_version_cache
      - restore_cache: *restore_node_modules_cache
      - run: yarn lint:ci
      - store_artifacts:
          path: reports/eslint.xml
      - store_test_results:
          path: reports/eslint.xml

  build:
    executor:
      name: node/default
      tag: *node_version
    steps:
      - restore_cache: *restore_repo_cache
      - restore_cache: *restore_version_cache
      - restore_cache: *restore_node_modules_cache
      - run: time yarn build
      - run: ls -alh dist/
      - run: du -hs dist/
      - save_cache: *save_build_cache

  publish-develop:
    executor:
      name: docker/docker
    steps:
      - setup_remote_docker
      - restore_cache: *restore_repo_cache
      - restore_cache: *restore_version_cache
      - restore_cache: *restore_build_cache
      - run: docker --version
      - docker/build:
          image: k8s-hello-world-test
          registry: $DOCKER_REGISTRY
      - run: echo -n "$DOCKER_PASSWORD" |docker login $DOCKER_REGISTRY -u $DOCKER_LOGIN --password-stdin
      - docker/push:
          image: k8s-hello-world-test
          registry: $DOCKER_REGISTRY

  deploy-develop:
    executor:
      name: docker/docker
    steps:
      - restore_cache: *restore_repo_cache
      - restore_cache: *restore_version_cache
      - restore_cache: *restore_build_cache
      - kubernetes/install-kubeconfig:
          kubeconfig: KUBECONFIG_DATA
      - helm/install_helm_client:
          version: v3.8.2
      - run: helm version
      - run: helm ls --namespace $HELM_NAMESPACE
      - run: helm repo add hcd $HELM_REGISTRY
      - run: helm repo update
      - helm/upgrade_helm_chart:
          chart: hcd/k8s-hello-world-test
          namespace: $HELM_NAMESPACE
          release_name: k8s-hello-world-test
          values_to_override: image.tag=$CIRCLE_SHA1
          reuse_values: true
          wait: false
      - run: helm ls --namespace $HELM_NAMESPACE

workflows:
  default:
    jobs:
      - checkout
      - version:
          requires:
            - checkout
      - install:
          requires:
            - version
      - test-lint:
          requires:
            - install
      - test-unit:
          requires:
            - install
      - test-e2e:
          requires:
            - install
      - build:
          requires:
            - test-lint
            - test-unit
            - test-e2e
      - publish-develop:
          context: k8s-hello-world-test
          filters:
            branches:
              only: /^develop$/
          requires:
            - build
      - deploy-develop:
          context: k8s-hello-world-test
          requires:
            - publish-develop
